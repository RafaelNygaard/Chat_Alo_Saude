<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperação de senha — {{ cabecalho.titulo }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>
<body>
  <div class="barra-gov">
    <span><strong>{{ cabecalho.orgao }}</strong> &nbsp;|&nbsp; Sistema {{ cabecalho.titulo }}</span>
  </div>

  <div class="login-tela">
    <div class="login-card">
      <div class="marca">
        {% if cabecalho.logo %}
          <img class="logo-icone" src="{{ cabecalho.logo }}" alt="{{ cabecalho.titulo }}">
        {% else %}
          <div class="logo-icone sem-imagem" aria-hidden="true">+</div>
        {% endif %}
        <div>
          <div class="titulo"><strong>{{ cabecalho.titulo }}</strong></div>
          <div class="subtitulo">Recuperação de senha</div>
        </div>
      </div>

      <form id="form-solicitar">
        <p class="modal-sub" style="margin:0">Informe seu e-mail ou matrícula. Enviaremos uma senha temporária, que deverá ser trocada no primeiro acesso.</p>
        <label>E-mail ou matrícula
          <input id="rec-id" type="text" required autocomplete="username">
        </label>
        <button class="btn" type="submit">Enviar senha temporária</button>
      </form>

      <p class="modal-erro" id="rec-erro" role="alert" hidden></p>
      <p id="rec-ok" style="background:var(--verde-claro);color:var(--verde);border-radius:6px;padding:.6rem .7rem;font-size:.85rem;font-weight:600" hidden></p>

      <a class="login-voltar" href="/login">← Voltar ao acesso</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/comum.js') }}"></script>
  <script>
    'use strict';
    const erro = document.getElementById('rec-erro');
    const ok = document.getElementById('rec-ok');
    document.getElementById('form-solicitar').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      erro.hidden = true;
      try {
        const r = await api.post('/api/recuperar-senha', {
          identificador: document.getElementById('rec-id').value.trim(),
        });
        ok.textContent = r.mensagem; ok.hidden = false;
        ev.target.reset();
      } catch (e) { erro.textContent = 'Informe um e-mail ou matrícula.'; erro.hidden = false; }
    });
  </script>
</body>
</html>
